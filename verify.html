<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Bayiira Membership Verification</title><link rel="stylesheet" href="style.css?v=30"></head><body><main class="container"><section class="card verify-card"><img src="logo.png" class="verify-logo" alt="Bayiira logo"><h1>BAYIIRA MEMBERSHIP ORGANISATION</h1><p class="muted">Official Membership Verification</p><div id="verifyState" class="verify-state">Checking membership...</div><div id="verifyResult" class="verify-result hidden"></div><a href="index.html" class="btn btn-primary verify-home">Membership Registration</a></section></main><script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script><script src="firebase-config.js?v=3"></script><script>(function(){const s=document.getElementById('verifyState'),r=document.getElementById('verifyResult');try{if(!window.firebase||!window.BAYIIRA_FIREBASE_CONFIG)throw new Error('Firebase configuration unavailable.');if(!firebase.apps.length)firebase.initializeApp(window.BAYIIRA_FIREBASE_CONFIG);const no=new URLSearchParams(location.search).get('member');if(!no)throw new Error('No membership number was supplied.');firebase.firestore().collection('verifications').doc(no).get().then(snap=>{if(!snap.exists){s.textContent='MEMBERSHIP NOT FOUND';s.className='verify-state verify-bad';return;}const d=snap.data();const expiry=Number(d.validUntil||0),year=new Date().getFullYear();const liveStatus=(expiry&&expiry<year)?'EXPIRED':(expiry&&expiry===year?'EXPIRING SOON':'ACTIVE');s.textContent=liveStatus==='EXPIRED'?'MEMBERSHIP FOUND — EXPIRED':'✓ MEMBERSHIP VERIFIED';s.className='verify-state '+(liveStatus==='EXPIRED'?'verify-bad':'verify-good');r.innerHTML='<div><span>Member</span><strong>'+esc(d.fullName)+'</strong></div><div><span>Membership No.</span><strong>'+esc(d.membershipNumber)+'</strong></div><div><span>Status</span><strong>'+esc(liveStatus)+'</strong></div><div><span>Membership Type</span><strong>'+esc(d.membershipType)+'</strong></div><div><span>Valid Until</span><strong>'+esc(d.validUntil)+'</strong></div>';r.classList.remove('hidden');}).catch(e=>{s.textContent='Verification could not be completed';s.className='verify-state verify-bad';console.error(e);});}catch(e){s.textContent=e.message;s.className='verify-state verify-bad';}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]);}})();</script></body></html>
